
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NASA Space Explorer</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>

<body>
  <div class="container">

    <header class="site-header">
      <img src="img/nasa-worm-logo.png" alt="NASA Logo" class="logo" />
      <h1>Space Explorer</h1>
    </header>

    <!-- Date selection -->
    <div class="filters">
      <input type="date" id="startDate" />
      <input type="date" id="endDate" />
      <button id="getImages">Get Space Images</button>
    </div>

    <!-- Random space fact -->
    <div class="space-fact">
      <h3>🚀 Did You Know?</h3>
      <p id="factText"></p>
    </div>

    <!-- Image gallery -->
    <div id="gallery" class="gallery">
      <div class="placeholder">
        <div class="placeholder-icon">🔭</div>
        <p>Select a date range and click "Get Space Images" to explore the cosmos!</p>
      </div>
    </div>

  </div>

  <!-- Image modal -->
  <div id="imageModal" class="modal">
    <div class="modal-content">
      <button id="closeModal" class="close-button">&times;</button>

      <h2 id="modalTitle"></h2>
      <p id="modalDate"></p>

      <img id="modalImage" alt="NASA Space Image" />

      <p id="modalExplanation"></p>
    </div>
  </div>

  <script src="js/dateRange.js"></script>
  <script src="js/script.js"></script>

</body>
</html>
